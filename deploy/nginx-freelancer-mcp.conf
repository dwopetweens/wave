# /etc/nginx/sites-available/freelancer-mcp
# Replace mcp.example.com with your subdomain (see DEPLOY_MCP.md).

limit_req_zone $binary_remote_addr zone=mcp_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.25.1+ prefers `listen 443 ssl;` plus `http2 on;`; this form works on 1.24 too.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    server_tokens off;

    # Shared proxy settings. Streaming must not be buffered, or Claude sees a
    # stalled connection: buffering, caching and gzip are all off.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    gzip off;

    # Browser steps of sign-in. Your own browser (phone or laptop) opens these,
    # so they are reachable from anywhere; the login form needs your password and
    # authenticator code, and is rate-limited per IP.
    location = /authorize {
        proxy_pass http://127.0.0.1:8765;
    }
    location = /login {
        limit_req zone=mcp_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8765;
    }

    # Everything else (the MCP endpoint, token, registration, discovery) is only
    # called by Claude's servers, so only Anthropic's egress range gets through.
    # Current range: https://platform.claude.com/docs/en/api/ip-addresses
    location / {
        allow 160.79.104.0/21;
        # allow YOUR.LAPTOP.IP;   # temporarily, to test with the MCP Inspector
        deny all;
        proxy_pass http://127.0.0.1:8765;
    }
}
